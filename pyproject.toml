[project]
name = "empress-dowager"
version = "0.1.0"
description = "Empress Dowager agent architecture in Python powered by LangChain/LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0.0,<2.0.0",
  "langgraph>=1.0.0,<2.0.0",
  "langchain-openai>=1.0.0,<2.0.0",
  "langfuse>=2.0.0,<4.0.0",
  "openviking>=0.1.0",
  "lark-oapi>=1.5.3,<2.0.0",
  "croniter>=3.0.3,<4.0.0",
  "pydantic>=2.11.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
]

[project.scripts]
empress-dowager = "main:main"

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["agent", "config", "core_types", "dispatcher", "main", "onboard", "utils"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gateway*", "memory*", "scheduler*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
